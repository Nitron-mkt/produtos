<title>Arara Nitron-MOB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap">

<style id="css">
/* Folha monocromática, como o manual impresso: preto sobre branco, sem cor. */
:root{
  --preto:#000; --branco:#fff; --cinza:#8A8A8A; --fundo:#D9DAD6;
  --linha:1px; --raio:2.2mm;
  --display:Archivo,"Arial Narrow","Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--preto);
  font-family:Figtree,-apple-system,Segoe UI,Roboto,sans-serif; font-size:14px; line-height:1.4;
  -webkit-font-smoothing:antialiased;
}
p,h1,h2,h3,h4,ul,ol{margin:0} ul{padding:0; list-style:none}
:focus-visible{outline:2px solid #1B6DD0; outline-offset:2px}

/* ---------- barra (só na tela) ---------- */
.barra{
  position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding-block:10px; padding-left:16px; padding-right:16px;
  background:rgba(217,218,214,.92); backdrop-filter:blur(8px); border-bottom:1px solid #A9ABA6;
}
.barra .marca{font-family:var(--display); font-weight:800; font-size:12.5px; letter-spacing:.07em;
  text-transform:uppercase; margin-right:auto; color:#26282A}
.barra .marca span{font-weight:600; letter-spacing:.02em; text-transform:none; color:#5E625F}
.btn{font:600 12.5px/1 Figtree,sans-serif; padding:9px 14px; border-radius:3px;
  border:1px solid #A9ABA6; background:#fff; color:#111; cursor:pointer}
.btn:hover{border-color:#4A4D49}
.btn[aria-pressed="true"]{background:#111; border-color:#111; color:#fff}
.btn.principal{background:#111; border-color:#111; color:#fff}
.btn:disabled{opacity:.42; cursor:default}
.recado{font-size:12px; color:#4A4D49}

/* ---------- a folha A4 ---------- */
.folhas{display:flex; flex-direction:column; align-items:center; gap:20px;
        padding-block:20px; padding-left:16px; padding-right:16px}
.folha{width:210mm; max-width:100%; height:297mm; background:var(--branco);
       padding:4mm; box-shadow:0 2px 10px rgba(0,0,0,.18)}
.moldura{border:var(--linha) solid var(--preto); border-radius:var(--raio);
         height:100%; padding:4mm 4.4mm 3.8mm; display:flex; flex-direction:column; gap:2.4mm;
         overflow:hidden}

/* ---------- topo: identificação + desenho do conjunto ---------- */
.cabeca{display:grid; grid-template-columns:1.06fr .94fr; gap:5mm; align-items:start}
h1{font-family:var(--display); font-weight:800; font-size:21px; line-height:1.02;
   letter-spacing:-.018em; text-transform:uppercase}
.ref{font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.01em;
     text-transform:uppercase; margin-top:2mm}
.selo{display:inline-block; border:var(--linha) solid var(--preto); border-radius:1.4mm;
      padding:1.5mm 3mm; font-size:10.5px; font-weight:500; margin-top:2.4mm}
.resist{font-size:11.5px; font-weight:500; margin-top:2mm}

h2{font-family:var(--display); font-weight:800; font-size:13.5px; letter-spacing:.005em;
   text-transform:uppercase; margin-bottom:1.8mm}

/* ---------- tabelas ---------- */
table{width:100%; border-collapse:collapse; table-layout:fixed}
th,td{border:var(--linha) solid var(--preto); padding:1mm 1.2mm; text-align:center; vertical-align:middle}
thead th{font-family:var(--display); font-weight:700; font-size:7.6px; letter-spacing:.045em; text-transform:uppercase}
.inclusas td{font-size:9px; font-weight:500; height:6.3mm}
.inclusas td.desc{font-size:8.4px; line-height:1.22}
.inclusas td.ref{font-weight:700; font-size:9.2px; white-space:nowrap; letter-spacing:-.01em}
.inclusas td.qtd{font-weight:700}
.nota{font-size:8.6px; font-weight:500; margin-top:1.6mm}

/* ---------- arte ---------- */
.arte{display:block; color:var(--preto); margin-inline:auto}
.arte svg{width:100%; height:100%; display:block; overflow:visible}
.inclusas .arte{height:6.6mm; width:15mm}
.inclusas .arte.barra-mad{height:3.4mm; width:17mm}

/* ---------- coluna direita ---------- */
.direita{display:flex; flex-direction:column; gap:3mm; height:100%}
.conjunto{flex:1; display:grid; place-items:center; min-height:0}
.conjunto .arte{height:46mm; width:auto}
.plasticas{border:var(--linha) solid var(--preto); border-radius:var(--raio); padding:2.4mm 3mm}
.plasticas h2{font-size:12px; margin-bottom:1.6mm}
.plasticas table{border-collapse:collapse}
.plasticas td{border:0; border-bottom:var(--linha) solid #C9C9C9; padding:.7mm 1mm; height:6.4mm}
.plasticas tr:last-child td{border-bottom:0}
.plasticas td.ref{font-weight:700; font-size:9.4px; text-align:left; width:16mm}
.plasticas td.nome{font-size:9.2px; font-weight:500; text-align:left}
.plasticas td.qtd{font-size:8.8px; font-weight:500; text-align:right; width:19mm}
.plasticas .arte{height:6.2mm; width:13mm}

/* ---------- montagem ---------- */
.montagem{display:grid; grid-template-columns:repeat(4,1fr); gap:2.2mm}
.etapa{border:var(--linha) solid var(--preto); border-radius:var(--raio);
       padding:1.8mm 2.2mm 1.8mm; display:flex; flex-direction:column; gap:1.2mm; min-height:0}
.etapa-topo{display:flex; gap:1.8mm; align-items:flex-start}
.numero{flex:none; width:4.6mm; height:4.6mm; border-radius:1mm; background:var(--preto);
        color:var(--branco); font-family:var(--display); font-weight:800; font-size:9.4px;
        display:grid; place-items:center}
.etapa h3{font-size:8.5px; font-weight:600; line-height:1.24}
.fig{flex:1; display:grid; place-items:center; min-height:0; padding-block:.6mm}
.fig .arte{max-height:22mm; height:22mm; width:100%}
.fig .arte svg{object-fit:contain; height:100%}
.usadas{font-size:7.8px; font-weight:500}
.usadas .rot{font-weight:700; margin-bottom:.5mm}
.usadas li{display:flex; gap:1.2mm; line-height:1.34}
.usadas li::before{content:"•"}

/* etapa 1: a conferência das peças, no lugar da ilustração */
.confere{display:grid; grid-template-columns:auto auto; gap:.3mm 2mm; font-size:7.8px;
         font-weight:500; justify-content:start}
.confere b{font-weight:700}
.confere .med{color:#3A3A3A}
.icones{display:grid; grid-template-columns:repeat(3,1fr); gap:1mm; margin-top:1.2mm}
.icones .um{text-align:center}
.icones .arte{height:5.8mm; width:100%}
.icones .lab{font-size:6.4px; font-weight:700; margin-top:.3mm}

/* ---------- rodapé ---------- */
.rodape{border:var(--linha) solid var(--preto); border-radius:var(--raio);
        padding:2.4mm 3mm; display:grid; grid-template-columns:auto 1fr auto auto;
        gap:3mm; align-items:center}
.aviso{display:flex; gap:2.2mm; align-items:flex-start}
.triangulo{flex:none; width:9mm; height:8mm}
.aviso h2{font-size:12.5px; margin-bottom:1mm}
.aviso li{font-size:8.4px; font-weight:500; line-height:1.36; display:flex; gap:1.2mm}
.aviso li::before{content:"•"}
.qr{width:14mm; height:14mm; display:grid; place-items:center; text-align:center;
    border:var(--linha) solid var(--preto); font-size:5.6px; font-weight:600; padding:1mm}
.qr img{width:100%; height:100%}
.tarja{border:1.1px dashed var(--preto); border-radius:1.4mm; padding:3mm 6mm;
       font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.005em;
       text-transform:uppercase; white-space:nowrap}

/* ---------- conferência (instrumento de edição, não imprime) ---------- */
.conferencia{width:210mm; max-width:100%; background:#fff; border:1px solid #A9ABA6;
             border-radius:3px; padding:14px 16px}
.conferencia h2{font-size:12.5px; margin-bottom:0}
.conferencia .sub{font-size:11.5px; color:#4A4D49; margin:5px 0 11px; max-width:72ch}
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(146px,1fr)); gap:1px; background:#D5D6D2}
.item{background:#fff; padding:7px 9px; display:flex; justify-content:space-between; gap:8px}
.item .r{font:700 11.5px/1 Figtree,sans-serif}
.item .v{font:500 11.5px/1 Figtree,sans-serif; font-variant-numeric:tabular-nums; color:#4A4D49}
.item.ruim{background:#F6E4E1} .item.ruim .r,.item.ruim .v{color:#9B2C1F; font-weight:700}
.veredito{margin-top:11px; font-size:12px; padding:8px 11px; border-left:3px solid #2F545E; background:#EDF2F3}
.veredito.ruim{border-color:#9B2C1F; background:#F6E4E1; color:#9B2C1F}
.pendencia{margin-top:10px; font-size:11.5px; line-height:1.5; padding:9px 11px; border:1px dashed #9B2C1F}
.pendencia b{font-family:var(--display); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase;
             color:#9B2C1F; display:block; margin-bottom:3px}

/* ---------- edição ---------- */
body.editando [data-e]{outline:1px dashed rgba(27,109,208,.6); outline-offset:2px}
body.editando [data-e]:hover{background:rgba(27,109,208,.10)}
body.editando [data-e]:focus{outline:2px solid #1B6DD0; background:transparent}

/* ---------- telas estreitas ---------- */
@media (max-width:820px){
  .folha{height:auto; padding:3mm}
  .cabeca,.montagem{grid-template-columns:1fr}
  .rodape{grid-template-columns:1fr; justify-items:start}
  .fig .arte{height:40mm; max-height:40mm}
  .conjunto .arte{height:70mm}
}

/* ---------- impressão ---------- */
@page{size:A4 portrait; margin:0}
@media print{
  body{background:#fff}
  .barra,.conferencia{display:none !important}
  .folhas{padding:0; gap:0}
  .folha{box-shadow:none; width:210mm; height:297mm}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const FONTES = "https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700&display=swap";
const BARRAS = ['PSC-04', 'PSA-05', 'PST-01', 'PSC-02'];

let DADOS = JSON.parse($('#dados').textContent);
let editando = false, sujo = false;

const leia = p => p.split('.').reduce((o, k) => o && o[k], DADOS);
function escreva(p, v) { const ks = p.split('.'), u = ks.pop(); ks.reduce((o, k) => o[k], DADOS)[u] = v; }
const campo = (c, tag, cls) => {
  const t = tag || 'span';
  return `<${t}${cls ? ` class="${cls}"` : ''} data-e="${c}">${esc(leia(c))}</${t}>`;
};
const arte = (ref, cls) =>
  ART[ref] ? `<span class="arte${cls ? ' ' + cls : ''}" aria-hidden="true">${ART[ref]}</span>` : '';

/* a conta: o que a lista declara x o que as etapas somam */
function confere() {
  const soma = {};
  DADOS.passos.forEach(p => (p.usa || []).forEach(([r, q]) => soma[r] = (soma[r] || 0) + q));
  return DADOS.pecas.map(p => ({ ref: p.ref, lista: p.qtd, etapas: soma[p.ref] || 0,
                                 ok: (soma[p.ref] || 0) === p.qtd }));
}

/* ---------- topo ---------- */
function cabeca() {
  const p = DADOS.produto;
  return `<div class="cabeca">
    <div>
      <h1 data-e="produto.nome">${esc(p.nome)}</h1>
      ${campo('produto.ref', 'div', 'ref')}
      ${campo('produto.selo', 'div', 'selo')}
      ${campo('produto.resistencia', 'div', 'resist')}

      <h2 style="margin-top:3mm">Peças inclusas</h2>
      <table class="inclusas">
        <thead><tr>
          <th style="width:8%">Número</th><th style="width:17.5%">Ref.</th>
          <th style="width:18%">Ilustração</th><th style="width:30%">Descrição</th>
          <th style="width:11.5%">Qtde.</th><th style="width:15%">Medida (cm)</th>
        </tr></thead>
        <tbody>${DADOS.pecas.map((c, i) => `<tr>
          <td>${i + 1}</td>
          <td class="ref" data-e="pecas.${i}.ref">${esc(c.ref)}</td>
          <td>${arte(c.art, BARRAS.includes(c.ref) ? 'barra-mad' : '')}</td>
          <td class="desc" data-e="pecas.${i}.desc">${esc(c.desc)}</td>
          <td class="qtd" data-e="pecas.${i}.qtd" data-num="1">${c.qtd}</td>
          <td data-e="pecas.${i}.med">${esc(c.med)}</td>
        </tr>`).join('')}</tbody>
      </table>
      <p class="nota">Medidas das peças de madeira em centímetros.</p>
    </div>

    <div class="direita">
      <div class="conjunto">${arte('conjunto')}</div>
      <section class="plasticas">
        <h2>Peças plásticas</h2>
        <table><tbody>${DADOS.pecas.filter(c => c.plastica).map(c => `<tr>
          <td class="ref">${esc(c.ref)}</td>
          <td style="width:16mm">${arte(c.art)}</td>
          <td class="nome">${esc(c.plastica)}</td>
          <td class="qtd">(${c.qtd} peça${c.qtd > 1 ? 's' : ''})</td>
        </tr>`).join('')}</tbody></table>
      </section>
    </div>
  </div>`;
}

/* ---------- etapa 1: a conferência, no lugar da ilustração ---------- */
function listaConferencia() {
  const mad = DADOS.pecas.filter(c => !c.plastica);
  const pla = DADOS.pecas.filter(c => c.plastica);
  return `<div class="confere">
      ${mad.map(c => `<b>${esc(c.ref)}</b><span class="med">${c.qtd} peças — ${esc(c.med)} cm</span>`).join('')}
    </div>
    <div class="icones">
      ${pla.map(c => `<div class="um">${arte(c.art)}<div class="lab">${esc(c.ref)}</div></div>`).join('')}
    </div>`;
}

function montagem() {
  return `<section>
    <h2>Montagem</h2>
    <div class="montagem">${DADOS.passos.map((s, i) => `<article class="etapa">
      <div class="etapa-topo">
        <span class="numero">${i + 1}</span>
        <h3 data-e="passos.${i}.titulo">${esc(s.titulo)}</h3>
      </div>
      <div class="fig">${s.fig ? arte(s.fig) : listaConferencia()}</div>
      ${(s.usa && s.usa.length) ? `<div class="usadas">
        <div class="rot">REF. usadas:</div>
        <ul>${s.usa.map(([r, q]) => `<li>${q}× ${esc(r)}</li>`).join('')}</ul></div>` : ''}
    </article>`).join('')}</div>
  </section>`;
}

function rodape() {
  return `<div class="rodape">
    <div class="aviso">
      <svg class="triangulo" viewBox="0 0 34 30" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M17 2.5 32 28H2z"/><path d="M17 11v8.5" stroke-linecap="round"/>
        <circle cx="17" cy="23.6" r="1.25" fill="currentColor" stroke="none"/>
      </svg>
      <div>
        <h2>Atenção</h2>
        <ul>${DADOS.atencao.map((t, i) => `<li>${campo('atencao.' + i)}</li>`).join('')}</ul>
      </div>
    </div>
    <div></div>
    <div class="qr" data-e="rodape.qr">${esc(DADOS.rodape.qr)}</div>
    <div class="tarja" data-e="rodape.video">${esc(DADOS.rodape.video)}</div>
  </div>`;
}

function painel() {
  const l = confere(), erros = l.filter(x => !x.ok);
  return `<section class="conferencia">
    <h2>Conferência da lista</h2>
    <p class="sub">Compara a quantidade declarada em PEÇAS INCLUSAS com a soma do que as 8 etapas
       pedem. É um instrumento de edição — não sai na impressão.</p>
    <div class="grade">${l.map(x => `<div class="item ${x.ok ? '' : 'ruim'}">
      <span class="r">${esc(x.ref)}</span><span class="v">${x.etapas} / ${x.lista}</span></div>`).join('')}</div>
    <p class="veredito ${erros.length ? 'ruim' : ''}">${erros.length
      ? erros.map(x => `${esc(x.ref)}: etapas somam ${x.etapas}, a lista diz ${x.lista}`).join('; ') + '.'
      : 'As 10 referências fecham: a soma das etapas bate com a lista de peças.'}</p>
    <div class="pendencia"><b>Pendência aberta</b><span data-e="pendencia">${esc(DADOS.pendencia)}</span></div>
  </section>`;
}

function desenha() {
  $('#app').innerHTML = `
    <div class="barra">
      <div class="marca">Nitron <span>· manual editável</span></div>
      <span class="recado" id="recado"></span>
      <button class="btn" id="bt-editar" aria-pressed="false">Editar textos</button>
      <button class="btn" id="bt-imprimir">Imprimir / PDF</button>
      <button class="btn principal" id="bt-salvar" disabled>Salvar versão</button>
    </div>
    <div class="folhas">
      <section class="folha"><div class="moldura">
        ${cabeca()}${montagem()}${rodape()}
      </div></section>
      ${painel()}
    </div>`;
  $('#bt-editar').addEventListener('click', alterna);
  $('#bt-imprimir').addEventListener('click', () => { if (editando) alterna(); print(); });
  $('#bt-salvar').addEventListener('click', salva);
  if (editando) liga();
  barra();
}

const liga = () => document.querySelectorAll('[data-e]').forEach(el => {
  el.contentEditable = 'true'; el.spellcheck = true;
});

function alterna() {
  if (editando) {
    document.querySelectorAll('[data-e]').forEach(el => {
      const txt = el.innerText.replace(/\s+/g, ' ').trim();
      const val = el.dataset.num ? (parseInt(txt, 10) || 0) : txt;
      if (val !== leia(el.dataset.e)) { escreva(el.dataset.e, val); sujo = true; }
    });
    editando = false; document.body.classList.remove('editando'); desenha();
  } else {
    editando = true; document.body.classList.add('editando'); liga(); barra();
  }
}

function barra() {
  const b = $('#bt-editar');
  if (b) { b.setAttribute('aria-pressed', String(editando));
           b.textContent = editando ? 'Concluir edição' : 'Editar textos'; }
  const s = $('#bt-salvar'); if (s) s.disabled = !sujo || editando;
  const r = $('#recado');
  if (r) r.textContent = editando ? 'Clique em qualquer texto para reescrever.'
        : sujo ? 'Há alterações não salvas.' : '';
}

/* o mesmo molde, só os dados mudam */
function documento() {
  const css = $('#css').textContent, js = $('#js').textContent;
  const json = JSON.stringify(DADOS, null, 1).replace(/<\//g, '<\\/');
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n<meta charset="utf-8">\n'
    + '<meta name="viewport" content="width=device-width,initial-scale=1">\n'
    + `<title>${esc(DADOS.produto.nome)}</title>\n<link rel="stylesheet" href="${FONTES}">\n`
    + `<style id="css">${css}</style>\n</head>\n<body>\n<div id="app"></div>\n`
    + `<script id="dados" type="application/json">\n${json}\n<\/script>\n`
    + `<script id="js">${js}<\/script>\n</body>\n</html>`;
}

async function salva() {
  const bt = $('#bt-salvar');
  bt.disabled = true; bt.textContent = 'Salvando…';
  try {
    const artifact = await claude.use('artifact');
    if (!artifact) throw new Error('sem-publicacao');
    await artifact.publish(documento());
    sujo = false; bt.textContent = 'Salvo';
  } catch (err) {
    bt.textContent = 'Salvar versão';
    const r = $('#recado');
    if (r) r.textContent = (err && err.code === 'conflict')
      ? 'Outra pessoa salvou primeiro — a página vai recarregar na versão dela.'
      : 'Não deu para salvar aqui. Use Imprimir / PDF para guardar esta versão.';
  }
  barra();
}

desenha();
</script>
