<title>Arara Nitron-MOB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">

<style id="css">
:root{
  --papel:#EFEFEB; --folha:#FFFFFF; --tinta:#16191C; --tinta2:#5C636A;
  --regua:#D8DAD5; --regua2:#EAEBE7; --sinal:#F0B429; --sinal-tinta:#16191C;
  --ardosia:#2F545E; --ardosia-fraca:#EAF0F1; --alerta:#AE3125; --alerta-fraca:#FBEDEB;
  --sombra:0 1px 2px rgba(22,25,28,.06), 0 8px 24px rgba(22,25,28,.08);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --papel:#0F1113; --folha:#1A1D20; --tinta:#E9EAE6; --tinta2:#9AA2A8;
    --regua:#333A3E; --regua2:#262B2E; --sinal:#E7AE1F; --sinal-tinta:#16191C;
    --ardosia:#8FBAC4; --ardosia-fraca:#1E2A2E; --alerta:#E4796C; --alerta-fraca:#2C1D1B;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --papel:#0F1113; --folha:#1A1D20; --tinta:#E9EAE6; --tinta2:#9AA2A8;
  --regua:#333A3E; --regua2:#262B2E; --sinal:#E7AE1F; --sinal-tinta:#16191C;
  --ardosia:#8FBAC4; --ardosia-fraca:#1E2A2E; --alerta:#E4796C; --alerta-fraca:#2C1D1B;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--papel); color:var(--tinta);
  font-family:"IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",sans-serif; margin:0; text-wrap:balance; letter-spacing:-.012em}
p{margin:0}
:focus-visible{outline:2px solid var(--ardosia); outline-offset:2px; border-radius:2px}

/* ---------- barra de ferramentas (só tela) ---------- */
.barra{
  position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px; align-items:center;
  padding-block:10px; padding-left:16px; padding-right:16px;
  background:color-mix(in srgb,var(--papel) 88%, transparent); backdrop-filter:blur(8px);
  border-bottom:1px solid var(--regua);
}
.barra .marca{font-family:Archivo; font-weight:700; font-size:13px; letter-spacing:.06em; text-transform:uppercase; margin-right:auto}
.barra .marca span{color:var(--tinta2); font-weight:500; letter-spacing:.02em; text-transform:none}
.btn{
  font:600 12.5px/1 "IBM Plex Sans",sans-serif; letter-spacing:.01em;
  padding:9px 14px; border-radius:3px; border:1px solid var(--regua);
  background:var(--folha); color:var(--tinta); cursor:pointer;
}
.btn:hover{border-color:var(--tinta2)}
.btn[aria-pressed="true"]{background:var(--sinal); border-color:var(--sinal); color:var(--sinal-tinta)}
.btn.principal{background:var(--tinta); border-color:var(--tinta); color:var(--folha)}
.btn:disabled{opacity:.45; cursor:default}
.recado{font-size:12px; color:var(--tinta2); font-variant-numeric:tabular-nums}

/* ---------- folha A4 ---------- */
.folhas{display:flex; flex-direction:column; align-items:center; gap:22px; padding-block:22px; padding-left:16px; padding-right:16px}
.folha{
  width:210mm; max-width:100%; min-height:297mm; background:var(--folha);
  padding:13mm 13mm 11mm; box-shadow:var(--sombra); position:relative;
  display:flex; flex-direction:column; gap:7mm;
}

/* ---------- cabeçalho ---------- */
.topo{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:start;
      border-bottom:2.5px solid var(--tinta); padding-bottom:9px}
.sobrancelha{font:600 10.5px/1 Archivo,sans-serif; letter-spacing:.17em; text-transform:uppercase; color:var(--ardosia)}
.topo h1{font-size:30px; font-weight:700; line-height:1.03; margin-top:6px}
.topo .chamada{color:var(--tinta2); font-size:13px; margin-top:5px; max-width:52ch}
.ref-cartao{text-align:right}
.ref-cartao .rot{font:500 9.5px/1 Archivo,sans-serif; letter-spacing:.14em; text-transform:uppercase; color:var(--tinta2)}
.ref-cartao .cod{font:600 19px/1.1 "IBM Plex Mono",monospace; margin-top:5px; letter-spacing:-.01em}

/* ---------- faixa de especificação ---------- */
.specs{display:grid; grid-template-columns:repeat(3,1fr); border:1px solid var(--regua)}
.specs div{padding:9px 12px; border-right:1px solid var(--regua)}
.specs div:last-child{border-right:0}
.specs dt{font:600 9.5px/1 Archivo,sans-serif; letter-spacing:.13em; text-transform:uppercase; color:var(--tinta2)}
.specs dd{margin:5px 0 0; font-size:14.5px; font-weight:600}

/* ---------- títulos de seção ---------- */
.secao{display:flex; align-items:baseline; gap:10px; margin-bottom:8px}
.secao h2{font-size:15px; font-weight:700; letter-spacing:.03em; text-transform:uppercase}
.secao .traco{flex:1; height:1px; background:var(--regua)}
.secao .nota{font-size:11.5px; color:var(--tinta2)}

/* ---------- antes de começar ---------- */
.antes{display:grid; grid-template-columns:repeat(2,1fr); gap:7px 16px}
.antes li{display:flex; gap:9px; font-size:12.5px; line-height:1.42; list-style:none}
.antes .qd{flex:none; width:15px; height:15px; margin-top:1px; border:1.5px solid var(--tinta2)}
.antes ul{margin:0; padding:0}

/* ---------- lista de peças ---------- */
table.bom{width:100%; border-collapse:collapse; font-size:12.5px}
table.bom th{
  font:600 9.5px/1 Archivo,sans-serif; letter-spacing:.12em; text-transform:uppercase;
  color:var(--tinta2); text-align:left; padding:0 8px 6px; border-bottom:1.5px solid var(--tinta);
}
table.bom th.n, table.bom td.n{text-align:right; font-variant-numeric:tabular-nums}
table.bom td{padding:5px 8px; border-bottom:1px solid var(--regua2); vertical-align:middle}
table.bom tr:last-child td{border-bottom:1.5px solid var(--tinta)}
.cel-ref{font:600 12.5px/1.2 "IBM Plex Mono",monospace; white-space:nowrap}
.cel-desc{color:var(--tinta2); line-height:1.35}
.cel-qtd{font:600 15px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; text-align:right}
.cel-med{font:400 12px/1 "IBM Plex Mono",monospace; text-align:right; font-variant-numeric:tabular-nums; color:var(--tinta2)}
td.cel-art{width:74px; padding:3px 8px}
.cel-art .arte{height:46px; width:66px}
.arte{display:block; color:var(--tinta)}
.arte svg{width:100%; height:100%; display:block; overflow:visible}

/* ---------- totais ---------- */
.totais{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--regua); border:1px solid var(--regua)}
.totais div{background:var(--folha); padding:8px 11px}
.totais .v{font:700 20px/1 Archivo,sans-serif; font-variant-numeric:tabular-nums}
.totais .r{font:500 9.5px/1.3 Archivo,sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--tinta2); margin-top:4px}

/* ---------- passos ---------- */
.passos{display:grid; grid-template-columns:repeat(2,1fr); gap:7px 9px; align-items:start}
.passo{border-top:1.5px solid var(--tinta); padding-top:7px; display:flex; flex-direction:column; gap:5px; break-inside:avoid}
.passo-topo{display:flex; gap:8px; align-items:baseline}
.passo .num{
  flex:none; width:21px; height:21px; background:var(--sinal); color:var(--sinal-tinta);
  font:700 12.5px/21px Archivo,sans-serif; text-align:center; align-self:flex-start;
}
.passo h3{font-size:13px; font-weight:700; line-height:1.2}
.passo .txt{font-size:11.8px; line-height:1.45; color:var(--tinta)}
.passo .conf{
  font-size:11px; line-height:1.4; color:var(--ardosia); background:var(--ardosia-fraca);
  padding:5px 8px; border-left:2.5px solid var(--ardosia);
}
.passo .conf b{font-weight:600; letter-spacing:.06em; text-transform:uppercase; font-size:9.5px; font-family:Archivo}
.usa{display:flex; flex-wrap:wrap; gap:3px; padding-top:1px}
.ficha{
  font:500 10.5px/1 "IBM Plex Mono",monospace; padding:3.5px 6px;
  border:1px solid var(--regua); background:var(--folha); white-space:nowrap;
}
.ficha b{font-weight:600; color:var(--ardosia)}
.usa .nada{font:400 11px/1 "IBM Plex Sans",sans-serif; color:var(--tinta2); font-style:italic}

/* ---------- espelhadas ---------- */
.espelho{border:1.5px solid var(--tinta); padding:10px 12px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center}
.espelho .par{display:flex; gap:10px}
.espelho .um{text-align:center}
.espelho .um .arte{height:52px; width:66px}
.espelho .um .lab{font:600 10.5px/1 "IBM Plex Mono",monospace; margin-top:4px}
.espelho h3{font-size:12.5px; font-weight:700; margin-bottom:4px}
.espelho p{font-size:11.5px; line-height:1.45; color:var(--tinta2)}

/* ---------- atenção ---------- */
.atencao{border:1.5px solid var(--tinta); display:grid; grid-template-columns:auto 1fr}
.atencao .faixa{
  background:var(--sinal); color:var(--sinal-tinta); padding:10px 12px; display:flex; align-items:center; gap:8px;
  font:700 12px/1 Archivo,sans-serif; letter-spacing:.1em; text-transform:uppercase; writing-mode:horizontal-tb;
}
.atencao ul{margin:0; padding:9px 12px; display:grid; grid-auto-flow:column;
             grid-template-rows:repeat(3,auto); grid-template-columns:repeat(2,1fr); gap:3px 16px}
.atencao li{font-size:11.5px; line-height:1.4; list-style:none; display:flex; gap:7px}
.atencao li::before{content:"—"; color:var(--tinta2); flex:none}

/* ---------- rodapé ---------- */
.rodape{margin-top:auto; padding-top:8px; border-top:1px solid var(--regua);
        display:flex; justify-content:space-between; align-items:flex-end; gap:16px}
.rodape .video{display:flex; gap:10px; align-items:center}
.rodape .qr{width:52px; height:52px; border:1px solid var(--regua); display:grid; place-items:center;
            font:500 8px/1.2 Archivo,sans-serif; text-align:center; color:var(--tinta2); padding:4px}
.rodape .video h4{font-size:12px; font-weight:700}
.rodape .video p{font-size:11px; color:var(--tinta2)}
.rodape .id{font:400 10px/1.5 "IBM Plex Mono",monospace; color:var(--tinta2); text-align:right}

/* ---------- conferência (instrumento de edição, não sai na impressão) ---------- */
.conferencia{
  width:210mm; max-width:100%; background:var(--folha); border:1px solid var(--regua);
  padding:14px 16px; box-shadow:var(--sombra);
}
.conferencia h2{font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase}
.conferencia .sub{font-size:11.5px; color:var(--tinta2); margin:4px 0 11px; max-width:70ch}
.conf-grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:1px; background:var(--regua)}
.conf-item{background:var(--folha); padding:7px 9px; display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.conf-item .r{font:600 11.5px/1 "IBM Plex Mono",monospace}
.conf-item .v{font:500 11.5px/1 "IBM Plex Mono",monospace; font-variant-numeric:tabular-nums; color:var(--tinta2)}
.conf-item.ruim{background:var(--alerta-fraca)}
.conf-item.ruim .r, .conf-item.ruim .v{color:var(--alerta); font-weight:600}
.veredito{margin-top:11px; font-size:12px; padding:8px 11px; border-left:3px solid var(--ardosia); background:var(--ardosia-fraca); color:var(--ardosia)}
.veredito.ruim{border-color:var(--alerta); background:var(--alerta-fraca); color:var(--alerta)}
.pendencia{margin-top:11px; font-size:11.5px; line-height:1.5; padding:9px 11px; border:1px dashed var(--alerta); color:var(--tinta)}
.pendencia b{font-family:Archivo; font-size:10px; letter-spacing:.11em; text-transform:uppercase; color:var(--alerta); display:block; margin-bottom:3px}

/* ---------- modo edição ---------- */
body.editando [data-e]{
  outline:1px dashed color-mix(in srgb,var(--ardosia) 55%, transparent); outline-offset:2px; border-radius:2px;
}
body.editando [data-e]:hover{background:color-mix(in srgb,var(--sinal) 20%, transparent)}
body.editando [data-e]:focus{outline:2px solid var(--ardosia); background:transparent}

/* ---------- telas estreitas ---------- */
@media (max-width:820px){
  .folha{width:100%; min-height:0; padding:18px 16px}
  .passos, .antes{grid-template-columns:1fr}
  .atencao ul{grid-auto-flow:row; grid-template-columns:1fr; grid-template-rows:none}
  .specs, .totais{grid-template-columns:repeat(2,1fr)}
  .specs div{border-bottom:1px solid var(--regua)}
  .atencao{grid-template-columns:1fr}
  .espelho{grid-template-columns:1fr}
  .topo{grid-template-columns:1fr}
  .ref-cartao{text-align:left}
  .rodape{flex-direction:column; align-items:flex-start}
  .rodape .id{text-align:left}
}

/* ---------- impressão ---------- */
@page{size:A4 portrait; margin:0}
@media print{
  body{background:#fff}
  .barra,.conferencia{display:none !important}
  .folhas{padding:0; gap:0}
  .folha{width:210mm; min-height:297mm; box-shadow:none; break-after:page; page-break-after:always}
  .folha:last-of-type{break-after:auto; page-break-after:auto}
  .passo,.espelho,.atencao,.totais{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>

const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const FONTES = "https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap";

let DADOS = JSON.parse($('#dados').textContent);
let editando = false, sujo = false;

/* --- leitura/escrita por caminho, ex.: "passos.3.txt" --- */
const leia = p => p.split('.').reduce((o, k) => o && o[k], DADOS);
function escreva(p, v) {
  const ks = p.split('.'), ult = ks.pop();
  ks.reduce((o, k) => o[k], DADOS)[ult] = v;
}

/* --- campo editável: um só lugar decide como texto vira HTML --- */
const campo = (caminho, tag, cls) => {
  const t = tag || 'span';
  return `<${t}${cls ? ` class="${cls}"` : ''} data-e="${caminho}">${esc(leia(caminho))}</${t}>`;
};

const arte = ref => ART[ref] ? `<span class="arte" aria-hidden="true">${ART[ref]}</span>` : '';

/* --- a conta: BOM declarado x soma das etapas --- */
function confere() {
  const soma = {};
  DADOS.passos.forEach(p => (p.usa || []).forEach(([r, q]) => soma[r] = (soma[r] || 0) + q));
  return DADOS.pecas.map(p => ({
    ref: p.ref, lista: p.qtd, etapas: soma[p.ref] || 0, ok: (soma[p.ref] || 0) === p.qtd
  }));
}

function totais() {
  const q = r => (DADOS.pecas.find(p => p.ref === r) || { qtd: 0 }).qtd;
  const g = nome => DADOS.pecas.filter(p => p.grupo === nome).reduce((a, p) => a + p.qtd, 0);
  return [
    { v: q('850L') + q('850TZ1') + q('850TZ2'), r: 'Conectores de canto' },
    { v: q('850H') + q('850T'), r: 'Porta-hastes e tampas' },
    { v: g('madeira'), r: 'Ripas de madeira' },
    { v: g('pe'), r: 'Pés' }
  ];
}

/* ---------- desenho da página ---------- */
function folhaUm() {
  const p = DADOS.produto;
  return `
  <section class="folha">
    <header class="topo">
      <div>
        ${campo('produto.sobrancelha', 'div', 'sobrancelha')}
        <h1 data-e="produto.nome">${esc(p.nome)}</h1>
        ${campo('produto.chamada', 'p', 'chamada')}
      </div>
      <div class="ref-cartao">
        <div class="rot">Referência</div>
        <div class="cod" data-e="produto.ref">${esc(p.ref)}</div>
      </div>
    </header>

    <dl class="specs">
      ${p.specs.map((s, i) => `<div>
        <dt data-e="produto.specs.${i}.rot">${esc(s.rot)}</dt>
        <dd data-e="produto.specs.${i}.val">${esc(s.val)}</dd></div>`).join('')}
    </dl>

    <section>
      <div class="secao"><h2>Antes de começar</h2><span class="traco"></span></div>
      <ul class="antes">
        ${DADOS.antes.map((t, i) => `<li><span class="qd"></span>${campo('antes.' + i)}</li>`).join('')}
      </ul>
    </section>

    <section>
      <div class="secao"><h2>Lista de peças</h2><span class="traco"></span>
        <span class="nota">Medidas das ripas de madeira em centímetros.</span></div>
      <table class="bom">
        <thead><tr>
          <th class="n">Nº</th><th>Peça</th><th>Ref.</th><th>Descrição</th>
          <th class="n">Qtde.</th><th class="n">Medida</th>
        </tr></thead>
        <tbody>
          ${DADOS.pecas.map((c, i) => `<tr>
            <td class="n">${i + 1}</td>
            <td class="cel-art">${arte(c.art)}</td>
            <td class="cel-ref" data-e="pecas.${i}.ref">${esc(c.ref)}</td>
            <td class="cel-desc" data-e="pecas.${i}.desc">${esc(c.desc)}</td>
            <td class="cel-qtd" data-e="pecas.${i}.qtd" data-num="1">${c.qtd}</td>
            <td class="cel-med" data-e="pecas.${i}.med">${esc(c.med)}</td>
          </tr>`).join('')}
        </tbody>
      </table>
    </section>

    <section>
      <div class="secao"><h2>O que vem na caixa</h2><span class="traco"></span>
        <span class="nota">${DADOS.pecas.reduce((a, c) => a + c.qtd, 0)} peças no total.</span></div>
      <div class="totais">
        ${totais().map(t => `<div><div class="v">${t.v}</div><div class="r">${t.r}</div></div>`).join('')}
      </div>
    </section>

    <div class="rodape">
      <div class="video">
        <div class="qr">QR do vídeo</div>
        <div>
          <h4 data-e="rodape.videoTitulo">${esc(DADOS.rodape.videoTitulo)}</h4>
          ${campo('rodape.videoTxt', 'p')}
        </div>
      </div>
      <div class="id"><span data-e="rodape.id">${esc(DADOS.rodape.id)}</span><br>Folha 1 de 2</div>
    </div>
  </section>`;
}

function folhaDois() {
  const e = DADOS.espelho;
  return `
  <section class="folha">
    <header class="topo">
      <div>
        <div class="sobrancelha">Passo a passo</div>
        <h1>${esc(DADOS.produto.nome)}</h1>
      </div>
      <div class="ref-cartao"><div class="rot">Referência</div><div class="cod">${esc(DADOS.produto.ref)}</div></div>
    </header>

    <div class="passos">
      ${DADOS.passos.map((s, i) => `<article class="passo">
        <div class="passo-topo">
          <span class="num">${i + 1}</span>
          <h3 data-e="passos.${i}.titulo">${esc(s.titulo)}</h3>
        </div>
        ${campo('passos.' + i + '.txt', 'p', 'txt')}
        <p class="conf"><b>Confira</b><br><span data-e="passos.${i}.conf">${esc(s.conf)}</span></p>
        ${(s.usa && s.usa.length)
          ? `<div class="usa">${s.usa.map(([r, q]) => `<span class="ficha"><b>${q}×</b> ${esc(r)}</span>`).join('')}</div>`
          : ''}
      </article>`).join('')}
    </div>

    <section class="espelho">
      <div class="par">
        <div class="um">${arte('850TZ1')}<div class="lab">850TZ1</div></div>
        <div class="um">${arte('850TZ2')}<div class="lab">850TZ2</div></div>
      </div>
      <div>
        <h3 data-e="espelho.titulo">${esc(e.titulo)}</h3>
        ${campo('espelho.txt', 'p')}
      </div>
    </section>

    <section class="atencao">
      <div class="faixa">⚠ Atenção</div>
      <ul>${DADOS.atencao.map((t, i) => `<li>${campo('atencao.' + i)}</li>`).join('')}</ul>
    </section>

    <div class="rodape">
      <div class="video">
        <div class="qr">QR do vídeo</div>
        <div><h4>${esc(DADOS.rodape.videoTitulo)}</h4><p>${esc(DADOS.rodape.videoTxt)}</p></div>
      </div>
      <div class="id">${esc(DADOS.rodape.id)}<br>Folha 2 de 2</div>
    </div>
  </section>`;
}

function painelConferencia() {
  const linhas = confere(), erros = linhas.filter(l => !l.ok);
  return `
  <section class="conferencia">
    <h2>Conferência da lista</h2>
    <p class="sub">Compara a quantidade declarada na lista de peças com a soma do que as etapas realmente pedem.
       Esta seção é um instrumento de edição e não sai na impressão.</p>
    <div class="conf-grade">
      ${linhas.map(l => `<div class="conf-item ${l.ok ? '' : 'ruim'}">
        <span class="r">${esc(l.ref)}</span>
        <span class="v">${l.etapas} / ${l.lista}</span></div>`).join('')}
    </div>
    <p class="veredito ${erros.length ? 'ruim' : ''}">
      ${erros.length
        ? `${erros.length} referência${erros.length > 1 ? 's' : ''} não fecha${erros.length > 1 ? 'm' : ''}: `
          + erros.map(l => `${esc(l.ref)} (etapas somam ${l.etapas}, a lista diz ${l.lista})`).join('; ') + '.'
        : 'As 10 referências fecham: a soma das etapas bate com a lista de peças.'}
    </p>
    <div class="pendencia"><b>Pendência aberta</b><span data-e="pendencia">${esc(DADOS.pendencia)}</span></div>
  </section>`;
}

function desenha() {
  $('#app').innerHTML = `
    <div class="barra">
      <div class="marca">Nitron <span>· manual editável</span></div>
      <span class="recado" id="recado"></span>
      <button class="btn" id="bt-editar" aria-pressed="false">Editar textos</button>
      <button class="btn" id="bt-imprimir">Imprimir / PDF</button>
      <button class="btn principal" id="bt-salvar" disabled>Salvar versão</button>
    </div>
    <div class="folhas">${folhaUm()}${folhaDois()}${painelConferencia()}</div>`;

  $('#bt-editar').addEventListener('click', alternaEdicao);
  $('#bt-imprimir').addEventListener('click', () => { if (editando) alternaEdicao(); print(); });
  $('#bt-salvar').addEventListener('click', salva);
  if (editando) ligaCampos();
  atualizaBarra();
}

function ligaCampos() {
  document.querySelectorAll('[data-e]').forEach(el => {
    el.contentEditable = 'true';
    el.spellcheck = true;
  });
}

function alternaEdicao() {
  if (editando) {          // saindo: recolhe o que foi digitado
    document.querySelectorAll('[data-e]').forEach(el => {
      const txt = el.innerText.replace(/\s+/g, ' ').trim();
      const val = el.dataset.num ? (parseInt(txt, 10) || 0) : txt;
      if (val !== leia(el.dataset.e)) { escreva(el.dataset.e, val); sujo = true; }
    });
    editando = false;
    document.body.classList.remove('editando');
    desenha();             // redesenha para recalcular totais e conferência
  } else {
    editando = true;
    document.body.classList.add('editando');
    ligaCampos();
    atualizaBarra();
  }
}

function atualizaBarra() {
  const b = $('#bt-editar');
  if (b) { b.setAttribute('aria-pressed', String(editando)); b.textContent = editando ? 'Concluir edição' : 'Editar textos'; }
  const s = $('#bt-salvar'); if (s) s.disabled = !sujo || editando;
  const r = $('#recado');
  if (r) r.textContent = editando ? 'Clique em qualquer texto para reescrever.'
        : sujo ? 'Há alterações não salvas.' : '';
}

/* --- documento publicado: o mesmo molde, só os dados mudam --- */
function documento() {
  const css = $('#css').textContent, js = $('#js').textContent;
  const json = JSON.stringify(DADOS, null, 1).replace(/<\//g, '<\\/');
  return '<!doctype html>\n<html lang="pt-BR">\n<head>\n'
    + '<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'
    + `<title>${esc(DADOS.produto.nome)}</title>\n`
    + `<link rel="stylesheet" href="${FONTES}">\n`
    + `<style id="css">${css}</style>\n</head>\n<body>\n<div id="app"></div>\n`
    + `<script id="dados" type="application/json">\n${json}\n<\/script>\n`
    + `<script id="js">${js}<\/script>\n</body>\n</html>`;
}

async function salva() {
  const bt = $('#bt-salvar');
  bt.disabled = true; bt.textContent = 'Salvando…';
  try {
    const artifact = await claude.use('artifact');
    if (!artifact) throw new Error('sem-publicacao');
    await artifact.publish(documento());
    sujo = false; bt.textContent = 'Salvo';
  } catch (err) {
    bt.textContent = 'Salvar versão';
    const r = $('#recado');
    if (r) r.textContent = (err && err.code === 'conflict')
      ? 'Outra pessoa salvou primeiro. A página vai recarregar na versão dela.'
      : 'Não foi possível salvar aqui — use Imprimir / PDF para guardar esta versão.';
  }
  atualizaBarra();
}

desenha();
</script>
